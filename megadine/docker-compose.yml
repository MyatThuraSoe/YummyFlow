services:
  postgres:
    image: postgres:15-alpine
    container_name: megadine_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-megadine}
      # No default: a shipped password is the same as no password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-megadine_pos}
      TZ: ${TZ:-Asia/Yangon}
    # Loopback only: the database is reached by the backend container over the
    # compose network, never by another machine on the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - megadine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-megadine} -d ${DB_NAME:-megadine_pos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APK_MIRROR: ${APK_MIRROR:-dl-cdn.alpinelinux.org}
    container_name: megadine_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-megadine}:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-megadine_pos}
      TZ: ${TZ:-Asia/Yangon}
      # Allow the LAN frontend origin; adjust to your host IP/domain.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Set to 1 only when nginx/another proxy sits in front of the backend.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PRINTER_MODE: ${PRINTER_MODE:-simulate}
      RECEIPT_PRINTER_IP: ${RECEIPT_PRINTER_IP:-}
      KITCHEN_PRINTER_IP: ${KITCHEN_PRINTER_IP:-}
      BACKUP_DIR: /app/backups
      # Where a mounted USB stick appears inside the container.
      USB_EXPORT_DIR: ${USB_EXPORT_DIR:-/usb}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      # false for plain-HTTP LAN installs; true only behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Hardware-bound license. MACHINE_ID pins the binding inside the
      # container (otherwise each rebuild generates a new machine id).
      LICENSE_KEY: ${LICENSE_KEY:-}
      MEGACODE_LICENSE_PUBLIC_KEY: ${MEGACODE_LICENSE_PUBLIC_KEY:-}
      MACHINE_ID: ${MACHINE_ID:-}
    # The frontend's nginx proxies /api and /socket.io, so the API does not
    # need to be published at all; loopback keeps it reachable for debugging.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      # One host directory, shared by dumps and the nightly off-machine copy.
      - ./backend/backups:/app/backups
      - ${USB_HOST_DIR:-./backend/usb}:/usb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: megadine_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  megadine_pgdata:
